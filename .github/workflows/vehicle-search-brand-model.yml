name: Update vehicle search brand model picker

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update search UI
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$HEAD_MESSAGE" = "chore: update vehicle search brand model picker [bot]" ]; then
            echo "Already applied."
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/vehicles/VehiclesClient.tsx')
          text = path.read_text()

          if 'VehicleBrandModelPicker' in text:
              print('Picker already present.')
              raise SystemExit(0)

          old_import = 'import MobileAppShell from "@/components/mobile/MobileAppShell";'
          new_import = old_import + '\nimport VehicleBrandModelPicker from "@/components/vehicles/VehicleBrandModelPicker";'
          text = text.replace(old_import, new_import, 1)

          start = text.index('                <section className="rounded-2xl border border-gray-200 bg-white p-3">\n                  <h3 className="mb-2 text-sm font-bold">\n                    برند و تیپ')
          end = text.index('                </section>', start) + len('                </section>')

          replacement = '''                <section className="rounded-2xl border border-gray-200 bg-white p-3">
                  <h3 className="mb-2 text-sm font-bold">
                    برند و مدل
                  </h3>

                  <VehicleBrandModelPicker
                    brand={brand}
                    model={model}
                    onChange={(nextBrand, nextModel) => {
                      handleFilterChange(setBrand, nextBrand);
                      handleFilterChange(setModel, nextModel);
                    }}
                  />
                </section>'''

          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          print('Vehicle search UI updated.')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/vehicles/VehiclesClient.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m 'chore: update vehicle search brand model picker [bot]'
          git push
