name: Update vehicle search brand model picker

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message != 'chore: update vehicle search brand model picker [bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update search UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/vehicles/VehiclesClient.tsx')
          text = path.read_text()

          old_import = 'import MobileAppShell from "@/components/mobile/MobileAppShell";'
          new_import = old_import + '\nimport VehicleBrandModelPicker from "@/components/vehicles/VehicleBrandModelPicker";'
          if 'VehicleBrandModelPicker' not in text:
              text = text.replace(old_import, new_import, 1)

          old = '''                <section className="rounded-2xl border border-gray-200 bg-white p-3">
                  <h3 className="mb-2 text-sm font-bold">
                    برند و تیپ
                  </h3>

                  <div className="space-y-2">
                    <input
                      value={brand}
                      onChange={(e) =>
                        handleFilterChange(setBrand, e.target.value)
                      }
                      placeholder="برند"
                      className="h-12 w-full rounded-xl border border-gray-200 bg-gray-50 px-3 text-base outline-none"
                    />

                    <input
                      value={model}
                      onChange={(e) =>
                        handleFilterChange(setModel, e.target.value)
                      }
                      placeholder="تیپ"
                      className="h-12 w-full rounded-xl border border-gray-200 bg-gray-50 px-3 text-base outline-none"
                    />
                  </div>
                </section>'''

          new = '''                <section className="rounded-2xl border border-gray-200 bg-white p-3">
                  <h3 className="mb-2 text-sm font-bold">
                    برند و مدل
                  </h3>

                  <VehicleBrandModelPicker
                    brand={brand}
                    model={model}
                    onChange={(nextBrand, nextModel) => {
                      handleFilterChange(setBrand, nextBrand);
                      handleFilterChange(setModel, nextModel);
                    }}
                  />
                </section>'''

          if old not in text:
              raise SystemExit('Expected old brand/model filter block was not found')

          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/vehicles/VehiclesClient.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'chore: update vehicle search brand model picker [bot]'
          git push
