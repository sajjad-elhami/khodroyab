name: Architect New Vehicle

on:
  push:
    branches:
      - architecture/mutation-server-actions

jobs:
  migrate:
    if: ${{ github.event.head_commit.message != 'refactor: migrate new vehicle mutation boundary' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/mutation-server-actions
          fetch-depth: 0
      - name: Migrate NewVehicleClient
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/app/vehicles/new/NewVehicleClient.tsx')
          s = p.read_text()
          old_import = 'import { createClient } from "@/lib/supabase/client";\n'
          new_import = old_import + 'import {\n  checkVehicleDuplicateAction,\n  createVehicleAction,\n  createVehicleBodyInspectionAction,\n  createVehicleImageRowsAction,\n  rollbackVehicleCreationAction,\n} from "../mutations";\n'
          if 'checkVehicleDuplicateAction' not in s:
              s = s.replace(old_import, new_import, 1)
          dup_old = '''    const supabase = createClient();\n\n    const { data, error } = await supabase.rpc(\n      "check_vehicle_duplicate",\n      {\n        p_dealership_id: dealershipId,\n        p_brand: brand.trim(),\n        p_model: model.trim(),\n        p_trim: trim.trim() || null,\n        p_model_year: modelYear ? Number(modelYear) : null,\n        p_mileage: mileage ? Number(mileage) : null,\n        p_color: color.trim() || null,\n        p_exclude_vehicle_id: null,\n      }\n    );\n\n    if (!error) {\n      setDuplicateVehicles((data ?? []) as DuplicateVehicle[]);\n    }\n'''
          dup_new = '''    const result = await checkVehicleDuplicateAction({\n      dealershipId,\n      brand: brand.trim(),\n      model: model.trim(),\n      trim: trim.trim() || null,\n      modelYear: modelYear ? Number(modelYear) : null,\n      mileage: mileage ? Number(mileage) : null,\n      color: color.trim() || null,\n      excludeVehicleId: null,\n    });\n\n    if (result.ok) {\n      setDuplicateVehicles((result.data ?? []) as DuplicateVehicle[]);\n    }\n'''
          if dup_old not in s:
              raise SystemExit('duplicate block not found')
          s = s.replace(dup_old, dup_new, 1)
          start = s.index('  async function createVehicle(e: React.FormEvent) {')
          end = s.index('\n  return (', start)
          new_fn = '''  async function createVehicle(e: React.FormEvent) {\n    e.preventDefault();\n\n    if (!dealershipId) {\n      setError("نمایشگاه را انتخاب کنید.");\n      return;\n    }\n\n    const finalValidationError = validateStep(1) || validateStep(2) || validateStep(3);\n    if (finalValidationError) { setError(finalValidationError); return; }\n    if (status !== "available" && status !== "sold") { setError("وضعیت خودرو نامعتبر است."); return; }\n\n    const yearValue = modelYear.trim() ? Number(modelYear) : null;\n    const mileageValue = mileage.trim() ? Number(mileage) : null;\n    const priceValue = price.trim() ? Number(price) : null;\n\n    if (yearValue === null || !Number.isInteger(yearValue) || yearValue < 1300 || yearValue > 1405) {\n      setError("سال مدل باید بین ۱۳۰۰ تا ۱۴۰۵ باشد."); return;\n    }\n    if (mileageValue === null || !Number.isInteger(mileageValue) || mileageValue < 0) {\n      setError("کارکرد باید یک عدد صحیح بزرگ‌تر یا مساوی صفر باشد."); return;\n    }\n    if (priceValue === null || !Number.isInteger(priceValue) || priceValue < 0) {\n      setError("قیمت باید یک عدد صحیح بزرگ‌تر یا مساوی صفر باشد."); return;\n    }\n\n    setSaving(true);\n    setError("");\n\n    const vehicleResult = await createVehicleAction({\n      dealershipId, brand: brand.trim(), model: model.trim(), trim: trim.trim() || null,\n      modelYear: yearValue, mileage: mileageValue, color: color.trim() || null,\n      price: priceValue, description: description.trim() || null, status,\n      transmission: gearboxType || selectedTrim?.transmission || null,\n      fuelType: fuelType || selectedTrim?.fuel_type || null,\n      bodyCondition: bodyCondition || null, chassisCondition: chassisCondition || null,\n      engineCondition: engineCondition || null, insuranceExpiryDate: insuranceDeadline || null,\n      gearboxCondition: gearboxCondition || null,\n    });\n\n    if (!vehicleResult.ok) { setError(vehicleResult.error); setSaving(false); return; }\n    const vehicleId = vehicleResult.vehicleId;\n\n    if (bodyInspection.length > 0) {\n      const inspectionResult = await createVehicleBodyInspectionAction(vehicleId, bodyInspection.map((item) => ({\n        partCode: item.part_code, condition: item.condition,\n        paintThicknessMicrons: item.paint_thickness_microns, notes: item.notes,\n      })));\n      if (!inspectionResult.ok) {\n        await rollbackVehicleCreationAction(vehicleId);\n        setError(`ذخیره کارشناسی بدنه ناموفق بود: ${inspectionResult.error}`);\n        setSaving(false); return;\n      }\n    }\n\n    const uploadedImagePaths: string[] = [];\n    const imageRows: { storagePath: string; thumbnailPath: string; sortOrder: number }[] = [];\n\n    try {\n      const supabase = createClient();\n      for (let i = 0; i < images.length; i++) {\n        const sourceFile = images[i];\n        const processed = await processVehicleImage(sourceFile);\n        const fileId = crypto.randomUUID();\n        const storagePath = `${vehicleId}/gallery/${fileId}.webp`;\n        const thumbnailPath = `${vehicleId}/gallery/thumb/${fileId}.webp`;\n\n        const { error: mainUploadError } = await supabase.storage.from("vehicle-images").upload(storagePath, processed.mainFile, { cacheControl: "31536000", upsert: false, contentType: "image/webp" });\n        if (mainUploadError) throw new Error(`آپلود تصویر "${sourceFile.name}" ناموفق بود: ${mainUploadError.message}`);\n        uploadedImagePaths.push(storagePath);\n\n        const { error: thumbnailUploadError } = await supabase.storage.from("vehicle-images").upload(thumbnailPath, processed.thumbnailFile, { cacheControl: "31536000", upsert: false, contentType: "image/webp" });\n        if (thumbnailUploadError) throw new Error(`آپلود thumbnail تصویر "${sourceFile.name}" ناموفق بود: ${thumbnailUploadError.message}`);\n        uploadedImagePaths.push(thumbnailPath);\n        imageRows.push({ storagePath, thumbnailPath, sortOrder: i });\n      }\n\n      if (imageRows.length > 0) {\n        const imageResult = await createVehicleImageRowsAction(vehicleId, imageRows);\n        if (!imageResult.ok) throw new Error(`ثبت اطلاعات تصاویر ناموفق بود: ${imageResult.error}`);\n      }\n    } catch (imageError) {\n      const supabase = createClient();\n      if (uploadedImagePaths.length > 0) await supabase.storage.from("vehicle-images").remove(uploadedImagePaths);\n      await rollbackVehicleCreationAction(vehicleId);\n      setError(imageError instanceof Error ? imageError.message : "پردازش یا آپلود تصویر ناموفق بود.");\n      setSaving(false); return;\n    }\n\n    if (vehicleResult.isAdmin && dealershipId) router.push(`/dealerships/${dealershipId}`);\n    else router.push("/vehicles");\n  }\n'''
          s = s[:start] + new_fn + s[end:]
          p.write_text(s)
          PY
          git diff --check
          test "$(grep -c 'checkVehicleDuplicateAction' src/app/vehicles/new/NewVehicleClient.tsx)" -ge 1
          test "$(grep -c 'supabase.*from(\"vehicles\")' src/app/vehicles/new/NewVehicleClient.tsx)" -eq 0
      - name: Commit migration and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/vehicles/new/NewVehicleClient.tsx .github/workflows/architect-new-vehicle.yml
          git rm .github/workflows/architect-new-vehicle.yml
          git commit -m "refactor: migrate new vehicle mutation boundary"
          git push origin architecture/mutation-server-actions
