name: Architect New Vehicle

on:
  push:
    branches:
      - architecture/mutation-server-actions

jobs:
  migrate:
    if: ${{ github.event.head_commit.message != 'refactor: migrate new vehicle mutation boundary' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/mutation-server-actions
          fetch-depth: 0
      - name: Migrate NewVehicleClient
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('src/app/vehicles/new/NewVehicleClient.tsx')
          s = p.read_text()

          old_import = 'import { createClient } from "@/lib/supabase/client";\n'
          new_import = old_import + 'import {\n  checkVehicleDuplicateAction,\n  createVehicleAction,\n  createVehicleBodyInspectionAction,\n  createVehicleImageRowsAction,\n  rollbackVehicleCreationAction,\n} from "../mutations";\n'
          if 'checkVehicleDuplicateAction' not in s:
              s = s.replace(old_import, new_import, 1)

          dup_old = '''    const supabase = createClient();\n\n    const { data, error } = await supabase.rpc(\n      "check_vehicle_duplicate",\n      {\n        p_dealership_id: dealershipId,\n        p_brand: brand.trim(),\n        p_model: model.trim(),\n        p_trim: trim.trim() || null,\n        p_model_year: modelYear ? Number(modelYear) : null,\n        p_mileage: mileage ? Number(mileage) : null,\n        p_color: color.trim() || null,\n        p_exclude_vehicle_id: null,\n      }\n    );\n\n    if (!error) {\n      setDuplicateVehicles((data ?? []) as DuplicateVehicle[]);\n    }\n'''
          dup_new = '''    const result = await checkVehicleDuplicateAction({\n      dealershipId,\n      brand: brand.trim(),\n      model: model.trim(),\n      trim: trim.trim() || null,\n      modelYear: modelYear ? Number(modelYear) : null,\n      mileage: mileage ? Number(mileage) : null,\n      color: color.trim() || null,\n      excludeVehicleId: null,\n    });\n\n    if (result.ok) {\n      setDuplicateVehicles((result.data ?? []) as DuplicateVehicle[]);\n    }\n'''
          if dup_old in s:
              s = s.replace(dup_old, dup_new, 1)
          else:
              raise SystemExit('duplicate block not found')

          start = s.index('  async function createVehicle(e: React.FormEvent) {')
          end = s.index('\n  return (', start)
          new_fn = '''  async function createVehicle(e: React.FormEvent) {\n    e.preventDefault();\n\n    if (!dealershipId) {\n      setError("نمایشگاه را انتخاب کنید.");\n      return;\n    }\n\n    const finalValidationError = validateStep(1) || validateStep(2) || validateStep(3);\n\n    if (finalValidationError) {\n      setError(finalValidationError);\n      return;\n    }\n\n    if (status !== "available" && status !== "sold") {\n      setError("وضعیت خودرو نامعتبر است.");\n      return;\n    }\n\n    const yearValue = modelYear.trim() ? Number(modelYear) : null;\n    const mileageValue = mileage.trim() ? Number(mileage) : null;\n    const priceValue = price.trim() ? Number(price) : null;\n\n    if (\n      yearValue === null ||\n      !Number.isInteger(yearValue) ||\n      yearValue < 1300 ||\n      yearValue > 1405\n    ) {\n      setError("سال مدل باید بین ۱۳۰۰ تا ۱۴۰۵ باشد.");\n      return;\n    }\n\n    if (\n      mileageValue === null ||\n      !Number.isInteger(mileageValue) ||\n      mileageValue < 0\n    ) {\n      setError("کارکرد باید یک عدد صحیح بزرگ‌تر یا مساوی صفر باشد.");\n      return;\n    }\n\n    if (\n      priceValue === null ||\n      !Number.isInteger(priceValue) ||\n      priceValue < 0\n    ) {\n      setError("قیمت باید یک عدد صحیح بزرگ‌تر یا مساوی صفر باشد.");\n      return;\n    }\n\n    setSaving(true);\n    setError("");\n\n    const vehicleResult = await createVehicleAction({\n      dealershipId,\n      brand: brand.trim(),\n      model: model.trim(),\n      trim: trim.trim() || null,\n      modelYear: yearValue,\n      mileage: mileageValue,\n      color: color.trim() || null,\n      price: priceValue,\n      description: description.trim() || null,\n      status,\n      transmission: gearboxType || selectedTrim?.transmission || null,\n      fuelType: fuelType || selectedTrim?.fuel_type || null,\n      bodyCondition: bodyCondition || null,\n      chassisCondition: chassisCondition || null,\n      engineCondition: engineCondition || null,\n      insuranceExpiryDate: insuranceDeadline || null,\n      gearboxCondition: gearboxCondition || null,\n    });\n\n    if (!vehicleResult.ok) {\n      setError(vehicleResult.error);\n      setSaving(false);\n      return;\n    }\n\n    const vehicleId = vehicleResult.vehicleId;\n\n    if (bodyInspection.length > 0) {\n      const inspectionResult = await createVehicleBodyInspectionAction(\n        vehicleId,\n        bodyInspection.map((item) => ({\n          partCode: item.part_code,\n          condition: item.condition,\n          paintThicknessMicrons: item.paint_thickness_microns,\n          notes: item.notes,\n        })),\n      );\n\n      if (!inspectionResult.ok) {\n        await rollbackVehicleCreationAction(vehicleId);\n        setError(`ذخیره کارشناسی بدنه ناموفق بود: ${inspectionResult.error}`);\n        setSaving(false);\n        return;\n      }\n    }\n\n    const uploadedImagePaths: string[] = [];\n    const imageRows: {\n      storagePath: string;\n      thumbnailPath: string;\n      sortOrder: number;\n    }[] = [];\n\n    try {\n      for (let i = 0; i < images.length; i++) {\n        const sourceFile = images[i];\n        const processed = await processVehicleImage(sourceFile);\n        const fileId = crypto.randomUUID();\n\n        const storagePath = `${vehicleId}/gallery/${fileId}.webp`;\n        const thumbnailPath = `${vehicleId}/gallery/thumb/${fileId}.webp`;\n\n        const supabase = createClient();\n\n        const { error: mainUploadError } = await supabase.storage\n          .from("vehicle-images")\n          .upload(storagePath, processed.mainFile, {\n            cacheControl: "31536000",\n            upsert: false,\n            contentType: "image/webp",\n          });\n\n        if (mainUploadError) {\n          throw new Error(\n            `آپلود تصویر "${sourceFile.name}" ناموفق بود: ${mainUploadError.message}`\n          );\n        }\n\n        uploadedImagePaths.push(storagePath);\n\n        const { error: thumbnailUploadError } = await supabase.storage\n          .from("vehicle-images")\n          .upload(thumbnailPath, processed.thumbnailFile, {\n            cacheControl: "31536000",\n            upsert: false,\n            contentType: "image/webp",\n          });\n\n        if (thumbnailUploadError) {\n          throw new Error(\n            `آپلود thumbnail تصویر "${sourceFile.name}" ناموفق بود: ${thumbnailUploadError.message}`\n          );\n        }\n\n        uploadedImagePaths.push(thumbnailPath);\n        imageRows.push({ storagePath, thumbnailPath, sortOrder: i });\n      }\n\n      if (imageRows.length > 0) {\n        const imageResult = await createVehicleImageRowsAction(vehicleId, imageRows);\n\n        if (!imageResult.ok) {\n          throw new Error(`ثبت اطلاعات تصاویر ناموفق بود: ${imageResult.error}`);\n        }\n      }\n    } catch (imageError) {\n      const supabase = createClient();\n\n      if (uploadedImagePaths.length > 0) {\n        await supabase.storage.from("vehicle-images").remove(uploadedImagePaths);\n      }\n\n      await rollbackVehicleCreationAction(vehicleId);\n\n      setError(\n        imageError instanceof Error\n          ? imageError.message\n          : "پردازش یا آپلود تصویر ناموفق بود."\n      );\n      setSaving(false);\n      return;\n    }\n\n    if (vehicleResult.isAdmin && dealershipId) {\n      router.push(`/dealerships/${dealershipId}`);\n    } else {\n      router.push("/vehicles");\n    }\n  }\n'''
          s = s[:start] + new_fn + s[end:]
          p.write_text(s)
          PY
          grep -nE 'checkVehicleDuplicateAction|createVehicleAction|createVehicleBodyInspectionAction|createVehicleImageRowsAction|rollbackVehicleCreationAction|supabase\.from\("vehicles"\)' src/app/vehicles/new/NewVehicleClient.tsx || true
          git diff --check
          git diff -- src/app/vehicles/new/NewVehicleClient.tsx
      - name: Commit migration and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/vehicles/new/NewVehicleClient.tsx .github/workflows/architect-new-vehicle.yml
          git rm .github/workflows/architect-new-vehicle.yml
          git commit -m "refactor: migrate new vehicle mutation boundary"
          git push origin architecture/mutation-server-actions
