name: Apply vehicles header cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update vehicles header
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/app/vehicles/VehiclesClient.tsx')
          text = path.read_text(encoding='utf-8')
          start = text.index('          <div className="mt-2 flex items-center gap-2 overflow-x-auto">')
          end = text.index('          </div>\n        </section>', start)
          text = text[:start] + text[end + len('          </div>\n'):]

          start = text.index('        {/* Result title */}')
          end = text.index('        {/* Loading */}', start)
          replacement = '''        {/* Result title */}
        <div className="flex items-center justify-between px-1">
          <p className="text-[13px] font-semibold text-gray-500">
            آگهی‌های ثبت‌شده توسط نمایشگاه‌ها
          </p>

          <span className="text-[12px] font-bold text-gray-500">
            {formatNumber(totalCount)} آگهی
          </span>
        </div>

'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-vehicles-header-cleanup.yml
          git add src/app/vehicles/VehiclesClient.tsx .github/workflows/apply-vehicles-header-cleanup.yml
          git commit -m "fix: simplify vehicle listings header"
          git push

# trigger cleanup
