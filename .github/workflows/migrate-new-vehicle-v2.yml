name: migrate-new-vehicle-client-v2

on:
  push:
    branches: [architecture/mutation-server-actions]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/mutation-server-actions
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply codemod
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/app/vehicles/new/NewVehicleClient.tsx')
          s = path.read_text()

          anchor = 'import { processVehicleImage } from "@/lib/images/processVehicleImage";'
          imports = anchor + '''\nimport {\n  checkVehicleDuplicateAction,\n  createVehicleAction,\n  createVehicleBodyInspectionAction,\n  createVehicleImageRowsAction,\n  rollbackVehicleCreationAction,\n} from "../mutations";'''
          if 'checkVehicleDuplicateAction' not in s:
              if anchor not in s: raise SystemExit('import anchor missing')
              s = s.replace(anchor, imports, 1)

          p = re.compile(r'  async function checkVehicleDuplicates\(\) \{.*?\n  \}\n\n  useEffect\(\(\) => \{', re.S)
          r = '''  async function checkVehicleDuplicates() {
    if (!dealershipId || !brand.trim() || !model.trim()) {
      setDuplicateVehicles([]);
      return;
    }

    setDuplicateChecking(true);

    const result = await checkVehicleDuplicateAction({
      dealershipId,
      brand,
      model,
      trim: trim.trim() || null,
      modelYear: modelYear ? Number(modelYear) : null,
      mileage: mileage ? Number(mileage) : null,
      color: color.trim() || null,
      excludeVehicleId: null,
    });

    if (result.ok) setDuplicateVehicles((result.data ?? []) as DuplicateVehicle[]);
    else setDuplicateVehicles([]);

    setDuplicateChecking(false);
  }

  useEffect(() => {'''
          s, n = p.subn(r, s, count=1)
          if n != 1: raise SystemExit('duplicate block missing')

          p = re.compile(r'    const supabase = createClient\(\);\n\n    const \{\n      data: \{ session \},\n      error: userError,\n    \} = await supabase\.auth\.getSession\(\);.*?    if \(vehicleError \|\| !vehicle\) \{.*?      return;\n    \}\n', re.S)
          r = '''    const vehicleResult = await createVehicleAction({
      dealershipId,
      brand,
      model,
      trim: trim.trim() || null,
      modelYear: yearValue,
      mileage: mileageValue,
      color: color.trim() || null,
      price: priceValue,
      description: description.trim() || null,
      status: status as "available" | "sold",
      transmission: gearboxType || selectedTrim?.transmission || null,
      fuelType: fuelType || selectedTrim?.fuel_type || null,
      bodyCondition: bodyCondition || null,
      chassisCondition: chassisCondition || null,
      engineCondition: engineCondition || null,
      insuranceExpiryDate: insuranceDeadline || null,
      gearboxCondition: gearboxCondition || null,
    });

    if (!vehicleResult.ok) {
      setError(vehicleResult.error);
      setSaving(false);
      return;
    }

    const vehicleId = vehicleResult.vehicleId;
    const isAdmin = vehicleResult.isAdmin;
'''
          s, n = p.subn(r, s, count=1)
          if n != 1: raise SystemExit('vehicle creation block missing')

          p = re.compile(r'    /\*\n     \* ذخیره کارشناسی بدنه\n     \*/\n    if \(bodyInspection\.length > 0\) \{.*?    \}\n\n    /\*\n     \* آپلود تصاویر\n     \*/', re.S)
          r = '''    /*
     * ذخیره کارشناسی بدنه
     */
    if (bodyInspection.length > 0) {
      const inspectionResult = await createVehicleBodyInspectionAction(
        vehicleId,
        bodyInspection.map((item) => ({
          partCode: item.part_code,
          condition: item.condition,
          paintThicknessMicrons: item.paint_thickness_microns,
          notes: item.notes,
        })),
      );

      if (!inspectionResult.ok) {
        await rollbackVehicleCreationAction(vehicleId);
        setError(`ذخیره کارشناسی بدنه ناموفق بود: ${inspectionResult.error}`);
        setSaving(false);
        return;
      }
    }

    /*
     * آپلود تصاویر
     */'''
          s, n = p.subn(r, s, count=1)
          if n != 1: raise SystemExit('inspection block missing')

          p = re.compile(r'  const uploadedImagePaths: string\[\] = \[\];\n\n  try \{.*?  \} catch \(imageError\) \{.*?    return;\n  \}\n', re.S)
          r = '''  const uploadedImagePaths: string[] = [];
  const imageRows: Array<{
    storagePath: string;
    thumbnailPath: string;
    sortOrder: number;
  }> = [];

  try {
    for (let i = 0; i < images.length; i++) {
      const sourceFile = images[i];
      const processed = await processVehicleImage(sourceFile);
      const fileId = crypto.randomUUID();
      const storagePath = `${vehicleId}/gallery/${fileId}.webp`;
      const thumbnailPath = `${vehicleId}/gallery/thumb/${fileId}.webp`;

      const { error: mainUploadError } = await supabase.storage
        .from("vehicle-images")
        .upload(storagePath, processed.mainFile, {
          cacheControl: "31536000",
          upsert: false,
          contentType: "image/webp",
        });

      if (mainUploadError) {
        throw new Error(`آپلود تصویر "${sourceFile.name}" ناموفق بود: ${mainUploadError.message}`);
      }
      uploadedImagePaths.push(storagePath);

      const { error: thumbnailUploadError } = await supabase.storage
        .from("vehicle-images")
        .upload(thumbnailPath, processed.thumbnailFile, {
          cacheControl: "31536000",
          upsert: false,
          contentType: "image/webp",
        });

      if (thumbnailUploadError) {
        throw new Error(`آپلود thumbnail تصویر "${sourceFile.name}" ناموفق بود: ${thumbnailUploadError.message}`);
      }
      uploadedImagePaths.push(thumbnailPath);
      imageRows.push({ storagePath, thumbnailPath, sortOrder: i });
    }

    const imageRowsResult = await createVehicleImageRowsAction(vehicleId, imageRows);
    if (!imageRowsResult.ok) {
      throw new Error(`ثبت اطلاعات تصاویر ناموفق بود: ${imageRowsResult.error}`);
    }
  } catch (imageError) {
    if (uploadedImagePaths.length > 0) {
      await supabase.storage.from("vehicle-images").remove(uploadedImagePaths);
    }

    await rollbackVehicleCreationAction(vehicleId);

    setError(
      imageError instanceof Error
        ? imageError.message
        : "پردازش یا آپلود تصویر ناموفق بود."
    );
    setSaving(false);
    return;
  }
'''
          s, n = p.subn(r, s, count=1)
          if n != 1: raise SystemExit('image block missing')

          if 'supabase.auth.getSession()' in s or '.from("vehicles").insert' in s or '.from("vehicle_body_inspections").insert' in s or '.from("vehicle_images").insert' in s:
              raise SystemExit('direct DB mutation/auth remains')

          path.write_text(s)
          PY

      - name: Verify build
        run: npm ci && npm run build

      - name: Commit and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/migrate-new-vehicle.yml .github/workflows/migrate-new-vehicle-v2.yml
          git add src/app/vehicles/new/NewVehicleClient.tsx .github/workflows/migrate-new-vehicle.yml .github/workflows/migrate-new-vehicle-v2.yml
          git diff --cached --quiet || git commit -m "refactor: route new vehicle mutations through server actions"
          git push origin architecture/mutation-server-actions
