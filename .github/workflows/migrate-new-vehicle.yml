name: Migrate NewVehicle mutation boundary

on:
  push:
    branches:
      - architecture/mutation-server-actions

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.event.head_commit.message != 'refactor: migrate new vehicle mutation boundary' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/mutation-server-actions
          fetch-depth: 0

      - name: Apply migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/app/vehicles/new/NewVehicleClient.tsx')
          s = p.read_text()

          marker = 'import { checkVehicleDuplicateAction, createVehicleAction, createVehicleBodyInspectionAction, createVehicleImageRowsAction, rollbackVehicleCreationAction } from "../mutations";'
          if marker not in s:
              s = s.replace(
                  'import { createClient } from "@/lib/supabase/client";\n',
                  'import { createClient } from "@/lib/supabase/client";\n' + marker + '\n',
                  1,
              )

          dup_pattern = re.compile(r'''    const supabase = createClient\(\);\n\n    const \{ data, error \} = await supabase\.rpc\(\n      "check_vehicle_duplicate",\n      \{.*?\n    \);\n\n    if \(!error\) \{\n      setDuplicateVehicles\(\(data \?\? \[\]\) as DuplicateVehicle\[\]\);\n    \}''', re.S)
          dup_replacement = '''    const result = await checkVehicleDuplicateAction({
      dealershipId,
      brand: brand.trim(),
      model: model.trim(),
      trim: trim.trim() || null,
      modelYear: modelYear ? Number(modelYear) : null,
      mileage: mileage ? Number(mileage) : null,
      color: color.trim() || null,
      excludeVehicleId: null,
    });

    if (result.ok) {
      setDuplicateVehicles((result.data ?? []) as DuplicateVehicle[]);
    }'''
          s, n = dup_pattern.subn(dup_replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'duplicate migration expected 1 replacement, got {n}')

          start = s.index('  async function createVehicle(e: React.FormEvent) {')
          end = s.index('\n  return (', start)
          new_fn = '''  async function createVehicle(e: React.FormEvent) {
    e.preventDefault();

    if (!dealershipId) {
      setError("نمایشگاه را انتخاب کنید.");
      return;
    }

    const finalValidationError = validateStep(1) || validateStep(2) || validateStep(3);
    if (finalValidationError) {
      setError(finalValidationError);
      return;
    }

    if (status !== "available" && status !== "sold") {
      setError("وضعیت خودرو نامعتبر است.");
      return;
    }

    const yearValue = modelYear.trim() ? Number(modelYear) : null;
    const mileageValue = mileage.trim() ? Number(mileage) : null;
    const priceValue = price.trim() ? Number(price) : null;

    if (yearValue === null || !Number.isInteger(yearValue) || yearValue < 1300 || yearValue > 1405) {
      setError("سال مدل باید بین ۱۳۰۰ تا ۱۴۰۵ باشد.");
      return;
    }
    if (mileageValue === null || !Number.isInteger(mileageValue) || mileageValue < 0) {
      setError("کارکرد باید یک عدد صحیح بزرگ‌تر یا مساوی صفر باشد.");
      return;
    }
    if (priceValue === null || !Number.isInteger(priceValue) || priceValue < 0) {
      setError("قیمت باید یک عدد صحیح بزرگ‌تر یا مساوی صفر باشد.");
      return;
    }

    setSaving(true);
    setError("");

    const vehicleResult = await createVehicleAction({
      dealershipId,
      brand: brand.trim(),
      model: model.trim(),
      trim: trim.trim() || null,
      modelYear: yearValue,
      mileage: mileageValue,
      color: color.trim() || null,
      price: priceValue,
      description: description.trim() || null,
      status,
      transmission: gearboxType || selectedTrim?.transmission || null,
      fuelType: fuelType || selectedTrim?.fuel_type || null,
      bodyCondition: bodyCondition || null,
      chassisCondition: chassisCondition || null,
      engineCondition: engineCondition || null,
      insuranceExpiryDate: insuranceDeadline || null,
      gearboxCondition: gearboxCondition || null,
    });

    if (!vehicleResult.ok) {
      setError(vehicleResult.error);
      setSaving(false);
      return;
    }

    const vehicleId = vehicleResult.vehicleId;

    if (bodyInspection.length > 0) {
      const inspectionResult = await createVehicleBodyInspectionAction(
        vehicleId,
        bodyInspection.map((item) => ({
          partCode: item.part_code,
          condition: item.condition,
          paintThicknessMicrons: item.paint_thickness_microns,
          notes: item.notes,
        })),
      );

      if (!inspectionResult.ok) {
        await rollbackVehicleCreationAction(vehicleId);
        setError(`ذخیره کارشناسی بدنه ناموفق بود: ${inspectionResult.error}`);
        setSaving(false);
        return;
      }
    }

    const uploadedImagePaths: string[] = [];
    const imageRows: { storagePath: string; thumbnailPath: string; sortOrder: number }[] = [];

    try {
      const supabase = createClient();

      for (let i = 0; i < images.length; i++) {
        const sourceFile = images[i];
        const processed = await processVehicleImage(sourceFile);
        const fileId = crypto.randomUUID();
        const storagePath = `${vehicleId}/gallery/${fileId}.webp`;
        const thumbnailPath = `${vehicleId}/gallery/thumb/${fileId}.webp`;

        const { error: mainUploadError } = await supabase.storage
          .from("vehicle-images")
          .upload(storagePath, processed.mainFile, {
            cacheControl: "31536000",
            upsert: false,
            contentType: "image/webp",
          });
        if (mainUploadError) {
          throw new Error(`آپلود تصویر "${sourceFile.name}" ناموفق بود: ${mainUploadError.message}`);
        }
        uploadedImagePaths.push(storagePath);

        const { error: thumbnailUploadError } = await supabase.storage
          .from("vehicle-images")
          .upload(thumbnailPath, processed.thumbnailFile, {
            cacheControl: "31536000",
            upsert: false,
            contentType: "image/webp",
          });
        if (thumbnailUploadError) {
          throw new Error(`آپلود thumbnail تصویر "${sourceFile.name}" ناموفق بود: ${thumbnailUploadError.message}`);
        }
        uploadedImagePaths.push(thumbnailPath);
        imageRows.push({ storagePath, thumbnailPath, sortOrder: i });
      }

      if (imageRows.length > 0) {
        const imageResult = await createVehicleImageRowsAction(vehicleId, imageRows);
        if (!imageResult.ok) {
          throw new Error(`ثبت اطلاعات تصاویر ناموفق بود: ${imageResult.error}`);
        }
      }
    } catch (imageError) {
      const supabase = createClient();
      if (uploadedImagePaths.length > 0) {
        await supabase.storage.from("vehicle-images").remove(uploadedImagePaths);
      }
      await rollbackVehicleCreationAction(vehicleId);
      setError(imageError instanceof Error ? imageError.message : "پردازش یا آپلود تصویر ناموفق بود.");
      setSaving(false);
      return;
    }

    if (vehicleResult.isAdmin && dealershipId) {
      router.push(`/dealerships/${dealershipId}`);
    } else {
      router.push("/vehicles");
    }
  }
'''
          s = s[:start] + new_fn + s[end:]

          p.write_text(s)
          PY

          grep -nE 'checkVehicleDuplicateAction|createVehicleAction|createVehicleBodyInspectionAction|createVehicleImageRowsAction|rollbackVehicleCreationAction' src/app/vehicles/new/NewVehicleClient.tsx
          if grep -q 'from("vehicles")' src/app/vehicles/new/NewVehicleClient.tsx; then
            echo 'ERROR: direct vehicles mutation remains'
            exit 1
          fi
          if grep -q 'check_vehicle_duplicate' src/app/vehicles/new/NewVehicleClient.tsx; then
            echo 'ERROR: direct duplicate RPC remains'
            exit 1
          fi
          git diff --check

      - name: Commit and remove migration workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/vehicles/new/NewVehicleClient.tsx
          git rm .github/workflows/migrate-new-vehicle.yml
          git commit -m "refactor: migrate new vehicle mutation boundary"
          git push origin architecture/mutation-server-actions
