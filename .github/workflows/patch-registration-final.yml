name: Apply registration final patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-registration-final.yml"
      - "src/app/vehicles/new/NewVehicleClient.tsx"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply final registration requirements'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch registration flow
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/app/vehicles/new/NewVehicleClient.tsx")
          s = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              s = s.replace(old, new, 1)

          if 'frontChassisCondition' not in s:
              replace_once(
                  '  const [chassisCondition, setChassisCondition] = useState("");\n',
                  '  const [frontChassisCondition, setFrontChassisCondition] = useState("");\n  const [rearChassisCondition, setRearChassisCondition] = useState("");\n  const [chassisTarget, setChassisTarget] = useState<"front" | "rear">("front");\n  const chassisCondition = JSON.stringify({\n    front: frontChassisCondition,\n    rear: rearChassisCondition,\n  });\n',
                  "chassis state",
              )

              replace_once(
                  '    setChassisCondition("");\n',
                  '    setFrontChassisCondition("");\n    setRearChassisCondition("");\n',
                  "clear chassis state",
              )

              replace_once(
                  '''    if (step === 3) {\n      if (!bodyCondition.trim()) {\n        return "وضعیت بدنه را انتخاب کنید.";\n      }\n\n      if (!chassisCondition.trim()) {\n        return "وضعیت شاسی را انتخاب کنید.";\n      }\n\n      if (!engineCondition.trim()) {\n        return "وضعیت موتور را انتخاب کنید.";\n      }\n\n      if (!insuranceDeadline.trim()) {\n        return "مهلت بیمه شخص ثالث را انتخاب کنید.";\n      }\n\n      if (!gearboxType.trim()) {\n        return "نوع گیربکس را انتخاب کنید.";\n      }\n\n      if (!gearboxCondition.trim()) {\n        return "وضعیت گیربکس را انتخاب کنید.";\n      }\n\n      return "";\n    }''',
                  '''    if (step === 3) {\n      if (!frontChassisCondition.trim() || !rearChassisCondition.trim()) {\n        return "وضعیت شاسی جلو و عقب را کامل کنید.";\n      }\n\n      return "";\n    }''',
                  "step 3 validation",
              )

              replace_once(
                  '''  function goNextStep() {\n    const validationError = validateStep(currentStep);\n\n    if (validationError) {\n      setError(validationError);\n      return;\n    }\n\n    setError("");\n    setCurrentStep((step) => Math.min(step + 1, 3));\n  }''',
                  '''  function highlightMissingRegistrationFields() {\n    if (currentStep !== 3) return;\n\n    const targets = [\n      ["شاسی جلو", !frontChassisCondition.trim()],\n      ["شاسی عقب", !rearChassisCondition.trim()],\n    ] as const;\n\n    let first: HTMLElement | null = null;\n\n    for (const [label, missing] of targets) {\n      const node = Array.from(document.querySelectorAll("button"))\n        .find((element) => element.textContent?.includes(label)) as HTMLButtonElement | undefined;\n\n      if (!node) continue;\n      node.classList.remove("border-gray-200", "text-gray-700");\n      if (missing) {\n        node.classList.add("border-red-400", "bg-red-50", "text-red-700", "ring-2", "ring-red-100");\n        if (!first) first = node;\n      } else {\n        node.classList.remove("border-red-400", "bg-red-50", "text-red-700", "ring-2", "ring-red-100");\n      }\n    }\n\n    first?.scrollIntoView({ behavior: "smooth", block: "center" });\n  }\n\n  function goNextStep() {\n    const validationError = validateStep(currentStep);\n\n    if (validationError) {\n      setError(validationError);\n      requestAnimationFrame(highlightMissingRegistrationFields);\n      return;\n    }\n\n    setError("");\n    setCurrentStep((step) => Math.min(step + 1, 3));\n  }''',
                  "required field feedback",
              )

              replace_once(
                  '''  useEffect(() => {\n    if (!brandId) {''',
                  '''  useEffect(() => {\n    function handleRegistrationBack(event: Event) {\n      event.preventDefault();\n      setError("");\n      setCurrentStep((step) => {\n        if (step <= 1) {\n          window.history.back();\n          return step;\n        }\n        return step - 1;\n      });\n    }\n\n    window.addEventListener("khodroyab:registration-back", handleRegistrationBack);\n    return () => window.removeEventListener("khodroyab:registration-back", handleRegistrationBack);\n  }, []);\n\n  function openChassisPicker(target: "front" | "rear") {\n    setChassisTarget(target);\n    openPicker("chassis");\n  }\n\n  useEffect(() => {\n    if (!brandId) {''',
                  "back stage handler",
              )

              replace_once(
                  '''setChassisCondition(item);\n                              setPickerOpen(null);''',
                  '''if (chassisTarget === "front") {\n                                setFrontChassisCondition(item);\n                              } else {\n                                setRearChassisCondition(item);\n                              }\n                              setPickerOpen(null);''',
                  "chassis picker selection",
              )

          # Remove stars from fields that are intentionally optional.
          for old, new in [
              ('وضعیت موتور <span className="text-red-500">*</span>', 'وضعیت موتور'),
              ('مهلت بیمه شخص ثالث <span className="text-red-500">*</span>', 'مهلت بیمه شخص ثالث'),
              ('نوع گیربکس <span className="text-red-500">*</span>', 'نوع گیربکس'),
              ('وضعیت گیربکس <span className="text-red-500">*</span>', 'وضعیت گیربکس'),
          ]:
              if old in s:
                  s = s.replace(old, new)

          # Replace the single chassis selector with two independent front/rear selectors.
          pattern = re.compile(
              r'''                <button\n                type="button"\n                onClick=\{\(\) => openPicker\("chassis"\)\}\n                className="flex min-h-\[64px\] w-full items-center justify-between px-4 text-right active:bg-gray-50"\n              >.*?                </button>''',
              re.S,
          )
          match = pattern.search(s)
          if not match:
              raise SystemExit("chassis UI block not found")

          replacement = '''                <div className="space-y-2 px-4 py-3">\n                  <div className="text-[14px] font-semibold text-gray-700">\n                    وضعیت شاسی <span className="text-red-500">*</span>\n                  </div>\n                  <div className="grid grid-cols-2 gap-2">\n                    <button\n                      type="button"\n                      onClick={() => openChassisPicker("front")}\n                      className={`flex min-h-[60px] items-center justify-between rounded-xl border px-3 text-right text-[13px] font-bold transition ${\n                        frontChassisCondition\n                          ? "border-red-200 bg-red-50 text-red-700"\n                          : "border-gray-200 bg-white text-gray-500"\n                      }`}\n                    >\n                      <span>شاسی جلو</span>\n                      <span>{frontChassisCondition || "انتخاب"}</span>\n                    </button>\n                    <button\n                      type="button"\n                      onClick={() => openChassisPicker("rear")}\n                      className={`flex min-h-[60px] items-center justify-between rounded-xl border px-3 text-right text-[13px] font-bold transition ${\n                        rearChassisCondition\n                          ? "border-red-200 bg-red-50 text-red-700"\n                          : "border-gray-200 bg-white text-gray-500"\n                      }`}\n                    >\n                      <span>شاسی عقب</span>\n                      <span>{rearChassisCondition || "انتخاب"}</span>\n                    </button>\n                  </div>\n                </div>'''
          s = s[:match.start()] + replacement + s[match.end():]

          path.write_text(s, encoding="utf-8")
          print("registration patch applied")
PY

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/vehicles/new/NewVehicleClient.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Apply final registration requirements"
          git push
